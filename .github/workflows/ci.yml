name: Sciora CI & Code Quality

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  audit:
    name: Run Quality & Simulation Audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Master Audit Suite (Curriculum, Simulations, Design, TypeScript, ESLint)
        run: npm test
